server:
  port: 8080

spring:
  cache:
    type: redis
    redis:
      time-to-live: 6000
  datasource:
    url: jdbc:h2:file:./data/fever-plans;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: localhost
      port: 6379

providers:
  retry-max-attempts: 3
  retry-initial-backoff-ms: 200
  retry-max-backoff-ms: 2000
  connect-timeout-ms: 5000
  read-timeout-ms: 10000
  sync-interval-ms: 60000
  list:
    - id: fever
      base-url: https://provider.code-challenge.feverup.com
      events-path: /api/events
